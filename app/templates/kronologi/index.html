{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

  <!-- Top Hero & Action Bar -->
  <div class="page-heading flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
          Kronologi Kejadian
        </h1>
        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300">
          {{ total }} Kejadian
        </span>
      </div>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
        Jejak rekam historis &amp; memori kronologi seluruh proses perencanaan pembangunan daerah Kota Tegal.
      </p>
    </div>

    <!-- Quick Action Buttons -->
    <div class="flex items-center gap-2.5 shrink-0">
      <a href="{{ root_path }}/dokumen" class="px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold inline-flex items-center gap-2 transition-colors">
        <i data-lucide="book-open" class="w-4 h-4 text-slate-400"></i>
        <span>Kelola Dokumen</span>
      </a>

      <button 
        hx-get="/kronologi/form{% if current_dokumen_id %}?dokumen_id={{ current_dokumen_id }}{% endif %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
        class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold shadow-md shadow-indigo-500/25 inline-flex items-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98]">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Catat Kejadian Baru</span>
      </button>
    </div>
  </div>

  <!-- Filters & Search Bar -->
  <div class="glass-card rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/80 space-y-3">
    <form 
      id="filter-kronologi-form"
      hx-get="/kronologi"
      hx-target="#timeline-container"
      hx-trigger="change, input delay:350ms from:input, refreshTimeline from:body"
      class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
      
      <!-- Search Input -->
      <div class="md:col-span-5 relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          name="q" 
          value="{{ current_q }}"
          placeholder="Cari judul, pihak pengusul, pembahasan, atau nomor surat..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400">
      </div>

      <!-- Dokumen Filter -->
      <div class="md:col-span-4">
        <select 
          name="dokumen_id" 
          class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          <option value="">Semua Dokumen Perencanaan</option>
          {% for doc in dokumen_list %}
          <option value="{{ doc.id }}" {% if current_dokumen_id == doc.id %}selected{% endif %}>
            {{ doc.nama }} ({{ doc.rentang_tahun }}){% if doc.is_default %} ★ [Default]{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- Jenis Kejadian Filter -->
      <div class="md:col-span-3">
        <select 
          name="jenis" 
          class="w-full px-3 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          <option value="">Semua Jenis Kejadian</option>
          {% for j in jenis_list %}
          <option value="{{ j.nama }}" {% if current_jenis == j.nama %}selected{% endif %}>
            {{ j.nama }}
          </option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  <!-- Timeline Cards Container (swapped via htmx) -->
  <div id="timeline-container" class="transition-opacity duration-200">
    {% include "partials/timeline_list.html" %}
  </div>

</div>
{% endblock %}
