# Tambahkan DI DALAM server HTTPS monevrkpd.tegalkota.go.id yang sudah ada.
# Jangan buat virtual host kedua dengan server_name yang sama.
location = /simetri {
    return 308 /simetri/;
}

# Webhook mempercayai identitas pengirim dari gateway; batasi ke gateway.
# Tambahkan IP gateway sebenarnya jika berada di mesin berbeda.
location ~ ^/simetri/api/whatsapp(?:/|$) {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8987;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}

location /simetri/ {
    # Slash akhir meneruskan /simetri/login sebagai /login.
    proxy_pass http://127.0.0.1:8987/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}
