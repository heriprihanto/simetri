# Tambahkan DI DALAM VirtualHost *:443 monevrkpd.tegalkota.go.id.
# Modul: proxy, proxy_http, headers, alias, authz_host.
ProxyPreserveHost On
RedirectMatch 308 ^/simetri$ /simetri/

# Letakkan sebelum ProxyPass / yang sudah ada agar prefix ini lebih dahulu cocok.
ProxyPass        /simetri/ http://127.0.0.1:8987/ timeout=120
ProxyPassReverse /simetri/ http://127.0.0.1:8987/

<Location /simetri/>
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 26214400
</Location>

# Tambahkan IP gateway sebenarnya jika berada di mesin berbeda.
<LocationMatch "^/simetri/api/whatsapp(?:/|$)">
    Require ip 127.0.0.1
</LocationMatch>
